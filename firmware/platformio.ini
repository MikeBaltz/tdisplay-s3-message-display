[env:lilygo-t-display-s3]
platform = espressif32@6.5.0
board = lilygo-t-display-s3
framework = arduino
# The official board definition uses the ESP32-S3R8 OPI PSRAM layout.
board_build.arduino.memory_type = qio_opi

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    bitbank2/AnimatedGIF @ ^2.2.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED
    -include include/tdisplay_s3_tft_setup.h

# No fixed port: macOS renames it (usbmodem101, 1101, 3101...) depending on the
# USB socket, so PlatformIO finds the board by itself.
monitor_speed = 115200
